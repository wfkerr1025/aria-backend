<section class="panel" id="fileops-panel">
  <div class="fileops-header">
    <div class="fileops-title">File Operations</div>
  </div>

  <div class="fileops-content">
    <div class="fileops-section-title">Recent Files</div>

    <div class="file-item" data-name="aria_blueprint.json" data-size="12 KB">
      <div class="file-name">aria_blueprint.json</div>
      <div class="file-size">12 KB</div>
    </div>

    <div class="file-item" data-name="steam_theme.css" data-size="8 KB">
      <div class="file-name">steam_theme.css</div>
      <div class="file-size">8 KB</div>
    </div>

    <div class="file-actions">
      <button class="file-btn" id="file-open-btn">Open</button>
      <button class="file-btn" id="file-reveal-btn">Reveal in Explorer</button>
    </div>
  </div>
</section>

<script>
  function fileOpsLog(msg) {
    try {
      if (window.aria && typeof window.aria.log === "function") {
        window.aria.log("FileOpsPanel", msg);
      }
    } catch (err) {
      console.error("[FileOpsPanel LOG ERROR]", err);
    }
  }

  fileOpsLog("FileOps panel inserted into DOM.");

  // Track file item clicks
  document.querySelectorAll(".file-item").forEach(item => {
    item.addEventListener("click", () => {
      const name = item.dataset.name;
      const size = item.dataset.size;

      fileOpsLog(`File item clicked → ${name} (${size})`);
    });
  });

  // Open button
  document.getElementById("file-open-btn")?.addEventListener("click", () => {
    const selected = document.querySelector(".file-item.active") ||
                     document.querySelector(".file-item");

    const name = selected?.dataset?.name || "unknown";
    fileOpsLog(`Open clicked → ${name}`);

    window.aria?.send("aria-command", {
      module: "fileops",
      command: "open",
      args: { name }
    });
  });

  // Reveal in Explorer button
  document.getElementById("file-reveal-btn")?.addEventListener("click", () => {
    const selected = document.querySelector(".file-item.active") ||
                     document.querySelector(".file-item");

    const name = selected?.dataset?.name || "unknown";
    fileOpsLog(`Reveal in Explorer clicked → ${name}`);

    window.aria?.send("aria-command", {
      module: "fileops",
      command: "reveal",
      args: { name }
    });
  });
</script>
