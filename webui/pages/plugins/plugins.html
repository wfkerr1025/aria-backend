<div class="plugins-page" id="plugins-page">
  <div class="plugins-page-header">
    <h1>Plugins</h1>
    <p class="plugins-page-subtitle">Integrations ARIA can use. Choose one to configure.</p>
  </div>

  <div class="plugins-page-actions">
    <!-- The page scans by itself when it opens. This button is for
         "look again", and unlike the automatic pass it reconsiders
         plugins that were previously removed. -->
    <button class="plugins-rescan" type="button" id="plugins-rescan">Rescan for Plugins</button>
  </div>

  <div class="plugins-error" id="plugins-error" hidden></div>

  <!-- Filled by plugins.js from aria_config/plugins.json. Nothing is
       hard-coded here: a plugin listed in markup is a plugin that keeps
       appearing after it has been removed. -->
  <div class="settings-tile-grid" id="plugins-grid"></div>

  <p class="plugins-empty" id="plugins-empty" hidden>
    No plugins are installed.
  </p>

  <!-- Unity CLI commands. Hidden entirely until the CLI reports some,
       so a machine without it sees no empty section asking about a
       tool it does not have. -->
  <section class="plugins-section" id="unity-commands-section" hidden>
    <div class="plugins-section-header">
      <h2>Unity CLI Commands</h2>
      <button class="plugins-rescan" type="button" id="unity-commands-refresh">Refresh Commands</button>
    </div>
    <p class="plugins-page-subtitle" id="unity-commands-note"></p>
    <div class="settings-tile-grid" id="unity-commands-grid"></div>
  </section>

  <!-- The terminal. One viewer, reused by every command. -->
  <section class="unity-terminal" id="unity-terminal" hidden>
    <div class="unity-terminal-bar">
      <span class="unity-terminal-title" id="unity-terminal-title">Unity CLI</span>
      <span class="unity-terminal-status" id="unity-terminal-status"></span>
      <span class="unity-terminal-spacer"></span>
      <button class="unity-terminal-btn" type="button" id="unity-terminal-clear">Clear</button>
      <button class="unity-terminal-btn" type="button" id="unity-terminal-close">Close</button>
    </div>
    <div class="unity-terminal-note" id="unity-terminal-note" hidden></div>
    <div class="unity-terminal-body" id="unity-terminal-body"></div>
    <pre class="unity-terminal-json" id="unity-terminal-json" hidden></pre>
  </section>
</div>
