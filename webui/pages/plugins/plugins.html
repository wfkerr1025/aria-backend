<div class="plugins-page" id="plugins-page">
  <div class="plugins-page-header">
    <h1>Plugins</h1>
    <p class="plugins-page-subtitle">Integrations ARIA can use. Choose one to configure.</p>
  </div>

  <div class="plugins-error" id="plugins-error" hidden></div>

  <!-- Filled by plugins.js from aria_config/plugins.json. Nothing is
       hard-coded here: a plugin listed in markup is a plugin that keeps
       appearing after it has been removed. -->
  <div class="settings-tile-grid" id="plugins-grid"></div>

  <p class="plugins-empty" id="plugins-empty" hidden>
    No plugins are installed.
  </p>
</div>
