<div class="settings-home" id="settings-home">
  <div class="settings-home-header">
    <h1>Settings</h1>
    <p class="settings-home-subtitle">Choose a category to configure.</p>
  </div>

  <div class="settings-tile-grid">
    <button class="settings-tile" type="button" data-panel="settings/appearance">
      <span class="settings-tile-icon">🎨</span>
      <span class="settings-tile-title">Appearance Settings</span>
      <span class="settings-tile-subtitle">Theme, accent color, density, and more</span>
    </button>

    <button class="settings-tile" type="button" data-panel="settings/cloud-llms">
      <span class="settings-tile-icon">☁️</span>
      <span class="settings-tile-title">Cloud LLMs</span>
      <span class="settings-tile-subtitle">Manage cloud provider API keys</span>
    </button>

    <button class="settings-tile" type="button" data-panel="settings/modules">
      <span class="settings-tile-icon">🧩</span>
      <span class="settings-tile-title">Modules</span>
      <span class="settings-tile-subtitle">Keys for feature modules like weather</span>
    </button>

    <button class="settings-tile" type="button" data-panel="settings/local-models">
      <span class="settings-tile-icon">💾</span>
      <span class="settings-tile-title">Local Models</span>
      <span class="settings-tile-subtitle">Installed models, disk usage, and compatibility</span>
    </button>
  </div>
</div>
