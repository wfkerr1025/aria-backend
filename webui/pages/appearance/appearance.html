<div class="settings-panel" id="appearance-page">
  <h2>Appearance Settings</h2>

  <div class="settings-group">
    <label for="appearance-color-scheme-select">Theme</label>
    <select id="appearance-color-scheme-select">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="system">System</option>
    </select>
  </div>

  <div class="settings-group">
    <label for="appearance-base-theme-select">Base Theme</label>
    <select id="appearance-base-theme-select"></select>
  </div>

  <div class="settings-group">
    <label for="appearance-accent-select">Accent Color</label>
    <select id="appearance-accent-select"></select>
  </div>

  <div class="settings-group">
    <label for="appearance-font-size-select">Font Size</label>
    <select id="appearance-font-size-select">
      <option value="small">Small</option>
      <option value="medium">Medium</option>
      <option value="large">Large</option>
    </select>
  </div>

  <div class="settings-group">
    <label for="appearance-density-select">UI Density</label>
    <select id="appearance-density-select">
      <option value="compact">Compact</option>
      <option value="comfortable">Comfortable</option>
      <option value="spacious">Spacious</option>
    </select>
  </div>

  <div class="settings-group appearance-toggle-group">
    <label for="appearance-animations-toggle">Animations</label>
    <input type="checkbox" id="appearance-animations-toggle" checked />
  </div>

  <div class="settings-group">
    <label for="appearance-chat-bubble-select">Chat Bubble Style</label>
    <select id="appearance-chat-bubble-select">
      <option value="rounded">Rounded</option>
      <option value="square">Square</option>
      <option value="minimal">Minimal</option>
    </select>
  </div>
</div>
