name: Smoke Test

on:
  pull_request:
    paths:
      - 'webui/**'
      - 'backend/**'
      - 'scripts/**'
      - '.github/**'

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Run smoke test
        shell: pwsh
        run: |
          pwsh -File scripts/smoke_test.ps1 -Port 3000 -TimeoutSeconds 15
