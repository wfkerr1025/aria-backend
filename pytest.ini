[pytest]
# One runner, and it collects everything.
#
# pytest's default python_files is "test_*.py *_test.py", which silently
# missed the 33 *_tests.py suites in backend/tests. They were run only by
# backend/tests/run_all_tests.py, so "pytest backend/tests: 3623 passed"
# was a true sentence about roughly seventy percent of the tests, and
# nothing anywhere said so.
python_files = test_*.py *_tests.py

markers =
    network: reaches a live third-party service. Deselected by default -- a
        failure would mean the network was slow, not that the code broke.
        Run deliberately with: pytest -m network
